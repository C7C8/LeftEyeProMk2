<div class="wide-content-container">
	<mat-card>
		<mat-card-header>
			<mat-card-title>
				<h1>Gallery</h1>
			</mat-card-title>
		</mat-card-header>

		<mat-card-content id="gallery-wrapper">

			<!-- Sidebar with search tools -->
			<div id="gallery-sidebar">
				<mat-card appearance="outlined">
					<mat-card-header>
						<mat-card-title>
							<h2>Search Tools</h2>
						</mat-card-title>
					</mat-card-header>
				</mat-card>
			</div>

			<!-- Gallery tiles -->
			<div id="gallery-tiles">
				@for (image of images; track image) {
					<app-gallery-image [imageName]="image" [sidecar]="sidecars.get(image)!"/>
				}
			</div>

		</mat-card-content>
	</mat-card>
</div>
